spring.application.name=education-consultancy

# ---------- Default application database: H2 in-memory (zero setup) ----------
spring.datasource.url=jdbc:h2:mem:edu_consultancy;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- Optional persistent-storage alternative: MySQL ----------
# To use MySQL instead of H2, comment out the H2 datasource settings above and uncomment these lines.
# spring.datasource.url=jdbc:mysql://localhost:3306/edu_consultancy?createDatabaseIfNotExist=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8081
spring.thymeleaf.cache=false

# ---------- JWT API authentication ----------
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---------- Razorpay test mode ----------
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
