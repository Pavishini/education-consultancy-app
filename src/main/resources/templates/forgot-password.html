<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot password')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="auth-wrap">
    <h2>Forgot password</h2>
    <p class="sub">Enter your email to generate a reset link.</p>

    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required/>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Send reset link</button>
    </form>
</div>

</body>
</html>
