<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My profile')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="page">
    <div class="page-header">
        <div>
            <h1>Student profile</h1>
            <p>Keep your details current for counselling and course recommendations.</p>
        </div>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

    <div class="form-card">
        <form th:action="@{/student/profile}" method="post">
            <div class="field">
                <label for="fullName">Full name</label>
                <input id="fullName" type="text" th:value="${student.fullName}" readonly/>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" th:value="${student.email}" readonly/>
            </div>
            <div class="field">
                <label for="phoneNumber">Phone number</label>
                <input id="phoneNumber" name="phoneNumber" type="text" th:value="${student.phoneNumber}" required/>
            </div>
            <div class="field">
                <label for="educationBackground">Education background</label>
                <textarea id="educationBackground" name="educationBackground" rows="3" th:text="${student.educationBackground}" required></textarea>
            </div>
            <div class="field">
                <label for="preferredCourse">Preferred course</label>
                <input id="preferredCourse" name="preferredCourse" type="text" th:value="${student.preferredCourse}" required/>
            </div>
            <button type="submit" class="btn btn-primary">Save profile</button>
        </form>
    </div>
</div>

</body>
</html>
