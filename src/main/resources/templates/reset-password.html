<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reset password')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="auth-wrap">
    <h2>Reset your password</h2>
    <p class="sub">Create a new password for your EduConsult account.</p>

    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

    <form th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}"/>
        <div class="field">
            <label for="password">New password</label>
            <input type="password" id="password" name="password" minlength="6" required/>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Update password</button>
    </form>
</div>

</body>
</html>
