<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create your account')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="auth-wrap">
    <h2>Create your account</h2>
    <p class="sub">Register as a student to browse and subscribe to courses.</p>

    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/register}" method="post">
        <div class="field">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" required autofocus/>
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required/>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="6" required/>
        </div>
        <div class="field">
            <label for="profile">Profile</label>
            <select id="profile" name="profile" required>
                <option value="STUDENT">Student</option>
                <option value="ADMIN">Admin</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Create account</button>
    </form>

    <p class="sub" style="margin-top:20px;">Already registered? <a th:href="@{/login}">Log in</a></p>
</div>

</body>
</html>
