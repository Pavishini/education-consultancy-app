<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Payment tracking')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="page">
    <div class="page-header">
        <div>
            <h1>Payment tracking</h1>
            <p>View unpaid, pending, and successful transactions.</p>
        </div>
    </div>

    <div class="form-card">
        <form method="get" th:action="@{/counsellor/payments}">
            <div class="field" style="margin-bottom:0;">
                <label for="status">Filter by payment status</label>
                <select id="status" name="status">
                    <option value="ALL" th:selected="${selectedStatus == 'ALL'}">All</option>
                    <option value="SUCCESS" th:selected="${selectedStatus == 'SUCCESS'}">Successful</option>
                    <option value="PENDING" th:selected="${selectedStatus == 'PENDING'}">Pending</option>
                    <option value="UNPAID" th:selected="${selectedStatus == 'UNPAID'}">Unpaid</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:12px;">Apply filter</button>
        </form>
    </div>

    <table>
        <thead>
        <tr>
            <th>Student</th>
            <th>Course</th>
            <th>Amount</th>
            <th>Date</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="payment : ${payments}">
            <td th:text="${payment.subscription.student.fullName}">Student</td>
            <td th:text="${payment.subscription.course.title}">Course</td>
            <td th:text="'₹' + ${#numbers.formatDecimal(payment.amount, 1, 2)}">₹0</td>
            <td th:text="${#temporals.format(payment.paymentDate, 'dd MMM yyyy')}">Date</td>
            <td><span class="badge badge-paid" th:text="${payment.status}">SUCCESS</span></td>
        </tr>
        <tr th:if="${#lists.isEmpty(payments)}">
            <td colspan="5" class="muted">No payments found for this filter.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
